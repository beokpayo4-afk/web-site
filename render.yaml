# Optional Render Blueprint. You can also set these in the Render dashboard.
databases:
  - name: nexora-db
    plan: free

services:
  - type: web
    name: web-site
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Dashboard "Start Command" must match this (not ./run-dev.sh).
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,web-site-1-wecz.onrender.com"
      - key: FRONTEND_URL
        value: "https://web-site-frontend-amber.vercel.app"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:5174,https://web-site-frontend-amber.vercel.app,https://web-site-1-wecz.onrender.com"
      # Injected from the linked Render Postgres service (not localhost).
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
