# Optional Render Blueprint. You can also set these in the Render dashboard.
services:
  - type: web
    name: web-site
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Dashboard "Start Command" must match this (not ./run-dev.sh).
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,web-site-1-wecz.onrender.com"
      # Set to your exact Vercel production URL (also allows *.vercel.app via regex on Render).
      # - key: FRONTEND_URL
      #   value: "https://your-app.vercel.app"
